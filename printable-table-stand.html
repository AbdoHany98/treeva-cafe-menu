<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treeva Cafe - Table Stand QR Poster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --accent: #000000;
      --text: #000000;
      --muted: #555555;
      --border: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f0f0f0;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Print Card Canvas (Target: 4x6" or A5 ratio) */
    .table-stand-card {
      width: 420px;
      background: var(--card-bg);
      border: 3px solid var(--border);
      border-radius: 28px;
      padding: 35px 30px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
      position: relative;
    }

    .brand-logo-img {
      max-width: 190px;
      height: auto;
      margin: 0 auto 12px;
      display: block;
      mix-blend-mode: multiply;
      clip-path: inset(2px);
    }

    .scan-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .scan-sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .qr-frame {
      background: white;
      padding: 14px;
      border-radius: 20px;
      display: inline-block;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border: 2px solid #000000;
      margin-bottom: 18px;
    }

    .cafe-hours {
      font-size: 0.82rem;
      color: var(--muted);
      border-top: 1px solid #e0e0e0;
      padding-top: 14px;
      margin-top: 5px;
      line-height: 1.5;
    }

    .cafe-hours i {
      color: #000000;
      margin-right: 4px;
    }

    .table-number-box {
      position: absolute;
      top: 18px;
      right: 20px;
      border: 2px solid #000000;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.75rem;
      color: #000000;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .no-print-bar {
      margin-top: 25px;
      display: flex;
      gap: 12px;
    }

    .btn-print {
      padding: 12px 28px;
      border-radius: 30px;
      background: #000000;
      color: #ffffff;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-print:hover {
      background: #222222;
      transform: translateY(-2px);
    }

    /* Print Styles */
    @media print {
      body {
        background: white !important;
        color: black !important;
        padding: 0;
      }
      .no-print-bar {
        display: none !important;
      }
      .table-stand-card {
        border-color: #000 !important;
        box-shadow: none !important;
        background: white !important;
        color: black !important;
        width: 100% !important;
        max-width: 420px;
        margin: 0 auto;
      }
      .scan-title {
        color: black !important;
      }
      .cafe-hours {
        color: #333 !important;
        border-top-color: #ccc !important;
      }
      .table-number-box {
        border-color: #000 !important;
        color: #000 !important;
      }
    }
  </style>
</head>
<body>

  <!-- Physical Table Stand Card -->
  <div class="table-stand-card">
    <img src="logo.jpg" alt="Treeva Cafe Logo" class="brand-logo-img" onerror="this.onerror=null; this.src='logo.png';">

    <div class="scan-title"><i class="fa-solid fa-mobile-screen"></i> Scan For Digital Menu</div>
    <div class="scan-sub">Point your phone camera to view prices & items</div>

    <div class="qr-frame">
      <div id="qrcode"></div>
    </div>

    <div class="cafe-hours">
      <div><i class="fa-solid fa-clock"></i> Weekdays: 8 AM - 1 AM | Weekends: 8 AM - 3 AM</div>
      <div style="margin-top: 4px;"><i class="fa-solid fa-location-dot"></i> 6th of October Hay Alashgar, Giza</div>
    </div>
  </div>

  <!-- Print Actions -->
  <div class="no-print-bar">
    <button class="btn-print" onclick="window.print()">
      <i class="fa-solid fa-print"></i> Print Stand Poster (Hard Copy)
    </button>
  </div>

  <script>
    // Generate high resolution QR code inside stand
    const targetUrl = window.location.origin ? (window.location.origin + '/index.html') : 'https://treevacafe.netlify.app';
    new QRCode(document.getElementById("qrcode"), {
      text: targetUrl,
      width: 200,
      height: 200,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
